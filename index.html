<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Shows</title>
    <!-- Add Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database.js"></script>
    <style>
        /* CSS from diff and assumed base */
        .calendar-title {
            font-size: 1.25rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .calendar-nav {
            /* Assuming base styles */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calendar-day.header {
            font-weight: 600;
            color: var(--text-muted);
            text-align: center;
        }

        .calendar-day.other-month {
            /* Assuming base */
            color: var(--text-muted);
        }

        /* Added or modified */
        /* Assuming this is for some container */
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;

        .remove-musician {
            background: var(--danger);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            flex-shrink: 0;
        }

        .add-seller-section {
            /* Assuming base */
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Add other CSS as needed; assuming the rest is in var(--) themes */
        :root {
            --text: #000;
            --bg: #fff;
            --border: #ddd;
            --text-muted: #666;
            --danger: #f00;
            --success: #0f0;
            /* etc. */
        }

        /* More CSS if needed */
    </style>
</head>
<body>
    <!-- HTML structure from diff -->
    <div class="card">
        <h3 style="margin-bottom: 1rem;">Vendedores Actuales</h3>
        <div id="sellersList"></div>
    </div>

    <div class="card">
        <h3 style="margin-bottom: 1rem;">➕ Agregar Músico</h3>
        <div class="add-seller-section">
            <div class="form-group">
                <label class="form-label">Nombre del Músico</label>
                <input type="text" class="form-input" id="newMusicianName" placeholder="Ej: Roberto">
            </div>
            <button class="btn btn-success" onclick="app.addMusician()">Agregar Músico</button>
        </div>

        <h3 style="margin-bottom: 1rem;">Músicos Actuales</h3>
        <div id="musiciansList"></div>
    </div>

    <div class="card">
        <h3 style="margin-bottom: 1rem;">Enlaces de Acceso</h3>
        <div id="linksContainer"></div>
    </div>

    <!-- Assume modal HTML -->
    <div id="modalShow" class="modal">
        <h2 class="modal-title" id="modalTitle">Nuevo Show</h2>
        <!-- Form fields for show: date, time, address, phone, total, deposit, depositTo, expenses, notes, seller -->
        <!-- Musician payments section -->
        <div id="musicianSection" style="display: none;">
            <h3>Músicos</h3>
            <div id="musicianPaymentsList"></div>
            <button onclick="app.addMusicianPayment()">Agregar Músico</button>
        </div>
        <!-- Save button -->
        <button onclick="app.saveShow(event)">Guardar</button>
    </div>

    <!-- Other HTML elements: calendar, reports, etc. -->
    <div id="calendar"></div>
    <div id="reports"></div>
    <!-- FAB button -->
    <button id="fabButton" onclick="app.openNewShowModal()">+</button>
    <!-- Nav config -->
    <div id="navConfig"></div>
    <div id="userBadge"></div>

    <script>
        // Firebase Config - Replace with your own!
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const appFirebase = firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const app = {
            currentUser: 'lisaurio', // Assume or set from login
            shows: {}, // Changed to object for Firebase
            config: {
                sellers: {
                    lisaurio: { name: 'Lisaurio', percentage: 0, isAdmin: true, color: '#10b981' },
                    valentin: { name: 'Valentín', percentage: 30, isAdmin: false, color: '#f59e0b' }
                },
                musicians: {
                    valentin: { name: 'Valentín', defaultPay: 50000 }
                }
            },
            musicianPayments: [],
            editingId: null,
            currentMonth: new Date(),
            currentView: 'calendar',

            init() {
                this.db = db;

                // Load config in real-time
                this.db.ref('config').on('value', (snap) => {
                    this.config = snap.val() || this.config; // Use default if null

                    if (!this.config.sellers.lisaurio) {
                        this.config.sellers.lisaurio = { name: 'Lisaurio', percentage: 0, isAdmin: true, color: '#10b981' };
                    }
                    if (!this.config.musicians) {
                        this.config.musicians = {
                            valentin: { name: 'Valentín', defaultPay: 50000 }
                        };
                    }
                    this.updateConfigToggles();
                    this.updateCSSColors();
                    this.renderSellersList();
                    this.renderMusiciansList();
                    this.renderLinks();
                    this.updateUserUI();
                });

                // Load shows in real-time
                this.db.ref('shows').on('value', (snap) => {
                    this.shows = snap.val() || {};
                    this.renderCalendar();
                    this.renderReports();
                    this.renderSellersList();
                    this.renderMusiciansList();
                    this.renderLinks();
                    this.updateShowCounter();
                });

                this.updateUserUI();
            },

            updateUserUI() {
                const badge = document.getElementById('userBadge');
                const navConfig = document.getElementById('navConfig');
                const fab = document.getElementById('fabButton');

                const seller = this.config.sellers[this.currentUser];
                badge.textContent = seller ? seller.name : 'Usuario';

                if (this.currentUser !== 'lisaurio') {
                    navConfig.style.display = 'none';
                } else {
                    navConfig.style.display = 'flex';
                }

                // TODOS pueden crear shows
                document.getElementById('fabButton').style.display = 'flex';
            },

            addSeller() {
                // Assume implementation: get name, percentage, color
                const name = /* from input */;
                const percentage = /* from input */;
                const color = /* from input */;
                const sellerId = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '');
                this.config.sellers[sellerId] = { name, percentage, isAdmin: false, color };
                this.saveConfig();
                this.renderSellersList();
                alert(`Vendedor ${name} agregado con ${percentage}% de comisión`);
            },

            addMusician() {
                const nameInput = document.getElementById('newMusicianName');
                const name = nameInput.value.trim();

                if (!name) {
                    alert('Ingresa un nombre para el músico');
                    return;
                }

                const musicianId = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '');

                if (this.config.musicians[musicianId]) {
                    alert('Este músico ya existe');
                    return;
                }

                this.config.musicians[musicianId] = {
                    name: name,
                    defaultPay: 50000
                };

                this.saveConfig();
                this.renderMusiciansList();
                
                nameInput.value = '';
                alert(`Músico ${name} agregado`);
            },

            removeSeller(sellerId) {
                if (sellerId === 'lisaurio') {
                    alert('No puedes eliminar a Lisaurio');
                    return;
                }
                if (!confirm(`¿Eliminar vendedor ${this.config.sellers[sellerId].name}?`)) return;
                delete this.config.sellers[sellerId];
                this.saveConfig();
                this.renderList();
            },

            removeMusician(musicianId) {
                if (!confirm(`¿Eliminar al músico ${this.config.musicians[musicianId].name}?`)) {
                    return;
                }

                delete this.config.musicians[musicianId];
                this.saveConfig();
                this.renderMusiciansList();
            },

            updateSellerPercentage(sellerId, newPercent) {
                if (this.config.sellers[sellerId]) {
                    this.config.sellers[sellerId].percentage = parseFloat(newPercent);
                    this.saveConfig();
                }
            },

            updateMusicianPay(musicianId, newPay) {
                if (this.config.musicians[musicianId]) {
                    this.config.musicians[musicianId].defaultPay = parseFloat(newPay);
                    this.saveConfig();
                }
            },

            updateSellerColor(sellerId, newColor) {
                if (this.config.sellers[sellerId]) {
                    this.config.sellers[sellerId].color = newColor;
                    this.saveConfig();
                    this.updateCSSColors();
                }
            },

            renderSellersList() {
                const container = document.getElementById('sellersList');
                let html = '';
                Object.keys(this.config.sellers).filter(s => s !== 'lisaurio').forEach(sellerId => {
                    const seller = this.config.sellers[sellerId];
                    html += `
                        <div class="musician-payment">
                            <div style="flex: 1;">
                                <strong>${seller.name}</strong>
                                <br>
                                <small style="color: var(--text-muted);">Comisión: ${seller.percentage}%</small>
                            </div>
                            <div style="display: flex; gap: 0.5rem; align-items: center;">
                                <input type="number" value="${seller.percentage}" min="0" max="100" step="5"
                                       style="width: 60px; padding: 0.5rem; border-radius: 6px; border: 2px solid var(--border); background: var(--bg); color: var(--text);"
                                       onchange="app.updateSellerPercentage('${sellerId}', this.value)">
                                <input type="color" value="${seller.color}"
                                       style="width: 40px; height: 40px; padding: 0; border: none; cursor: pointer;"
                                       onchange="app.updateSellerColor('${sellerId}', this.value)">
                                <button class="remove-musician" onclick="app.removeSeller('${sellerId}')">✕</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            },

            renderMusiciansList() {
                const container = document.getElementById('musiciansList');
                
                let html = '';
                Object.keys(this.config.musicians).forEach(musicianId => {
                    const musician = this.config.musicians[musicianId];
                    
                    html += `
                        <div class="musician-payment">
                            <div style="flex: 1;">
                                <strong>${musician.name}</strong>
                                <br>
                                <small style="color: var(--text-muted);">Pago por defecto: $${this.formatMoney(musician.defaultPay)}</small>
                            </div>
                            <div style="display: flex; gap: 0.5rem; align-items: center;">
                                <input type="number" 
                                       value="${musician.defaultPay}" 
                                       min="0" step="1000"
                                       style="width: 100px; padding: 0.5rem; border-radius: 6px; border: 2px solid var(--border); background: var(--bg); color: var(--text);"
                                       onchange="app.updateMusicianPay('${musicianId}', this.value)">
                                <button class="remove-musician" onclick="app.removeMusician('${musicianId}')">✕</button>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            },

            renderLinks() {
                const container = document.getElementById('linksContainer');
                const baseUrl = window.location.origin + window.location.pathname;
                let html = '';
                Object.keys(this.config.sellers).forEach(sellerId => {
                    html += `<div><a href="${baseUrl}?user=${sellerId}">${this.config.sellers[sellerId].name}</a></div>`;
                });
                container.innerHTML = html;
            },

            handleSellerChange() {
                const seller = document.getElementById('inputSeller').value;
                const musicianSection = document.getElementById('musicianSection');
                if (seller === 'lisaurio') {
                    musicianSection.style.display = 'block';
                    if (this.musicianPayments.length === 0) {
                        this.musicianPayments = [{
                            id: Date.now(),
                            musician: 'valentin',
                            amount: this.config.musicians.valentin?.defaultPay || 50000
                        }];
                        this.renderMusicianPayments();
                    }
                } else {
                    musicianSection.style.display = 'none';
                    this.musicianPayments = [];
                    this.renderMusicianPayments();
                }
            },

            addMusicianPayment() {
                const id = Date.now();
                this.musicianPayments.push({ 
                    id, 
                    musician: Object.keys(this.config.musicians)[0] || '',
                    amount: this.config.musicians[Object.keys(this.config.musicians)[0]]?.defaultPay || 50000
                });
                this.renderMusicianPayments();
            },

            removeMusicianPayment(id) {
                this.musicianPayments = this.musicianPayments.filter(m => m.id !== id);
                this.renderMusicianPayments();
            },

            renderMusicianPayments() {
                const container = document.getElementById('musicianPaymentsList');
                let html = '';
                this.musicianPayments.forEach(payment => {
                    html += `
                        <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem; align-items: center;">
                            <select onchange="app.updateMusicianPayment(${payment.id}, 'musician', this.value)" 
                                    style="flex: 1; padding: 0.5rem; border-radius: 6px; border: 2px solid var(--border); background: var(--bg); color: var(--text); margin-right: 0.5rem;">
                                <option value="">Seleccionar músico</option>
                                ${Object.keys(this.config.musicians).map(m => 
                                    `<option value="${m}" ${payment.musician === m ? 'selected' : ''}>${this.config.musicians[m].name}</option>`
                                ).join('')}
                            </select>
                            <input type="number" 
                                   value="${payment.amount}" 
                                   min="0" step="1000"
                                   style="width: 100px; padding: 0.5rem; border-radius: 6px; border: 2px solid var(--border); background: var(--bg); color: var(--text);"
                                   onchange="app.updateMusicianPayment(${payment.id}, 'amount', this.value)">
                            <button onclick="app.removeMusicianPayment(${payment.id})" style="padding: 0.5rem; background: var(--danger); color: white; border-radius: 6px;">✕</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            },

            updateMusicianPayment(id, field, value) {
                const payment = this.musicianPayments.find(m => m.id === id);
                if (payment) {
                    if (field === 'amount') {
                        payment[field] = parseFloat(value);
                    } else if (field === 'musician') {
                        payment[field] = value;
                        if (this.config.musicians[value]) {
                            payment.amount = this.config.musicians[value].defaultPay;
                            this.renderMusicianPayments();
                        }
                    }
                }
            },

            changeView(view) {
                this.currentView = view;
                if (view === 'calendar') this.renderCalendar();
                if (view === 'list') this.renderList();
                if (view === 'reports') this.renderReports();
                if (view === 'config') {
                    this.renderSellersList();
                    this.renderMusiciansList();
                    this.renderLinks();
                }
            },

            openNewShowModal() {
                // Solo Lisaurio o vendedores?
                this.editingId = null;
                this.musicianPayments = [];

                document.getElementById('modalTitle').textContent = 'Nuevo Show';
                document.getElementById('modalShow').classList.add('active');

                // Clear inputs
                document.getElementById('inputDate').value = '';
                document.getElementById('inputTime').value = '';
                document.getElementById('inputAddress').value = '';
                document.getElementById('inputPhone').value = '';
                document.getElementById('inputTotal').value = '';
                document.getElementById('inputDeposit').value = '';
                document.getElementById('inputExpenses').value = '';
                document.getElementById('inputNotes').value = '';

                this.updateSellerOptions();
                document.getElementById('inputSeller').value = this.currentUser;
                document.getElementById('inputDepositTo').value = this.currentUser;

                this.handleSellerChange();
                this.calculateSaldo();
            },

            openEditModal(id) {
                const show = this.shows[id];
                if (this.currentUser !== 'lisaurio' && show.seller !== this.currentUser) return;

                this.editingId = id;

                document.getElementById('modalTitle').textContent = 'Editar Show';
                document.getElementById('modalShow').classList.add('active');

                // Fill inputs
                document.getElementById('inputDate').value = show.date;
                document.getElementById('inputTime').value = show.time;
                document.getElementById('inputAddress').value = show.address;
                document.getElementById('inputPhone').value = show.phone;
                document.getElementById('inputTotal').value = show.total;
                document.getElementById('inputDeposit').value = show.deposit;
                document.getElementById('inputDepositTo').value = show.depositTo;
                document.getElementById('inputExpenses').value = show.expenses;
                document.getElementById('inputNotes').value = show.notes;
                document.getElementById('inputSeller').value = show.seller;

                this.musicianPayments = show.musicianPayments || [];
                this.renderMusicianPayments();
                this.handleSellerChange();
                this.calculateSaldo();
            },

            saveShow(event) {
                event.preventDefault();

                const seller = document.getElementById('inputSeller').value;
                const total = parseFloat(document.getElementById('inputTotal').value);
                const deposit = parseFloat(document.getElementById('inputDeposit').value) || 0;
                const depositTo = document.getElementById('inputDepositTo').value;
                const expenses = parseFloat(document.getElementById('inputExpenses').value) || 0;
                const netAmount = total - expenses;

                const showData = {
                    date: document.getElementById('inputDate').value,
                    time: document.getElementById('inputTime').value,
                    address: document.getElementById('inputAddress').value,
                    phone: document.getElementById('inputPhone').value,
                    total,
                    deposit,
                    depositTo,
                    expenses,
                    notes: document.getElementById('inputNotes').value,
                    seller
                };

                if (seller === 'lisaurio') {
                    showData.musicianPayments = this.musicianPayments.filter(mp => mp.musician && mp.amount > 0);
                    let totalMusicianPayments = 0;
                    showData.musicianPayments.forEach(mp => {
                        totalMusicianPayments += mp.amount;
                    });
                    const depositForLisaurio = depositTo === 'lisaurio' ? deposit : 0;
                    showData.saldoLisaurio = netAmount - totalMusicianPayments - depositForLisaurio;
                } else {
                    const sellerConfig = this.config.sellers[seller];
                    const commission = netAmount * (sellerConfig.percentage / 100);
                    const depositForSeller = depositTo === seller ? deposit : 0;
                    showData.saldoSeller = commission - depositForSeller;
                    const depositForLisaurio = depositTo === 'lisaurio' ? deposit : 0;
                    showData.saldoLisaurio = netAmount - commission - depositForLisaurio;
                }

                const id = this.editingId || Date.now();
                showData.id = id;

                this.db.ref('shows/' + id).set(showData);

                this.addToLog(this.editingId ? 'edit' : 'add', showData);
                this.closeModal();
                this.renderCalendar();
                this.renderList();
                this.renderReports();
                this.updateShowCounter();
            },

            deleteShow(id) {
                const show = this.shows[id];
                if (this.currentUser !== 'lisaurio' && show.seller !== this.currentUser) return;
                
                if (!confirm('¿Eliminar este show?')) return;

                this.addToLog('delete', show);
                this.db.ref('shows/' + id).remove();

                this.renderCalendar();
                this.renderList();
                this.renderReports();
                this.updateShowCounter();
            },

            renderList() {
                const container = /* assume element */;
                const shows = this.getFilteredShows().sort((a, b) => new Date(b.date) - new Date(a.date));
                let html = '';
                const empty = /* assume */;
                if (shows.length === 0) {
                    empty.style.display = 'block';
                    container.innerHTML = '';
                    return;
                }
                empty.style.display = 'none';

                Object.values(shows).forEach(show => { // Since shows is object
                    const canEdit = this.currentUser === 'lisaurio' || show.seller === this.currentUser;
                    const showDetails = this.shouldShowDetails(show);

                    const saldo = show.total - show.deposit - show.expenses;

                    html += `
                        <div class="card">
                            <div class="card-header">
                                <span>${new Date(show.date).toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' })} • ${show.time}</span>
                                <span style="background: ${this.config.sellers[show.seller]?.color}; color: white; padding: 0.25rem 0.5rem; border-radius: 4px;">${this.getSellerName(show.seller)}</span>
                            </div>
                            <div class="card-info">
                                ${showDetails.showAddress ? `
                                    <div class="card-row">📍 ${show.address}</div>
                                ` : ''}
                               
                               ${showDetails.showPhone ? `
                                   <div class="card-row">📞 ${show.phone}</div>
                               ` : ''}
                               
                               ${showDetails.showTotal ? `
                                   <div class="card-row">💰 Total: $${this.formatMoney(show.total)}</div>
                               ` : ''}
                               
                               ${showDetails.canSeeDeposit ? `
                                   <div class="card-row">💵 Seña: $${this.formatMoney(show.deposit)} (${this.getSellerName(show.depositTo)})</div>
                               ` : ''}
                               
                               ${showDetails.showExpenses ? `
                                   <div class="card-row">🚗 Gastos: $${this.formatMoney(show.expenses)}</div>
                               ` : ''}
                               
                               ${show.notes && showDetails.showFullDetails ? `<div class="card-row">📝 ${show.notes}</div>` : ''}
                           </div>

                           ${this.renderSaldoSection(show, showDetails)}
                           
                           ${showDetails.showFullDetails ? `
                                <div class="card-highlight">
                                    💰 SALDO A COBRAR (Cliente): $${this.formatMoney(Math.max(0, saldo))}
                                </div>
                            ` : ''}
                           
                           ${canEdit ? `
                               <div class="card-actions">
                                   <button onclick="app.openEditModal(${show.id})">Editar</button>
                                   <button onclick="app.deleteShow(${show.id})">Eliminar</button>
                               </div>
                           ` : ''}
                        </div>
                    `;
                });
                container.innerHTML = html;
            },

            renderSaldoSection(show, showDetails) {
                if (!showDetails.canSeeSaldos) return '';

                let html = '<div class="saldo-section">';

                if (show.seller === 'lisaurio') {
                    html += `
                        <div class="saldo-row">
                            <span>💵 Saldo Lisaurio:</span>
                            <span>$${this.formatMoney(show.saldoLisaurio || 0)}</span>
                        </div>
                    `;
                    if (show.musicianPayments && show.musicianPayments.length > 0) {
                        show.musicianPayments.forEach(mp => {
                            const musicianName = this.config.musicians[mp.musician]?.name || mp.musician;
                            html += `
                                <div class="saldo-row">
                                    <span>💵 Saldo ${musicianName}:</span>
                                    <span>$${this.formatMoney(mp.amount)}</span>
                                </div>
                            `;
                        });
                    }
                } else {
                    const sellerName = this.getSellerName(show.seller);
                    
                    if (this.currentUser === 'lisaurio' || this.currentUser === show.seller) {
                        html += `
                            <div class="saldo-row">
                                <span>💵 Saldo ${sellerName}:</span>
                                <span>$${this.formatMoney(show.saldoSeller || 0)}</span>
                            </div>
                            <div class="saldo-row">
                                <span>💵 Saldo Lisaurio:</span>
                                <span>$${this.formatMoney(show.saldoLisaurio || 0)}</span>
                            </div>
                        `;
                    }
                }

                html += '</div>';
                return html;
            },

            renderCalendar() {
                const title = /* assume */;
                const year = this.currentMonth.getFullYear();
                const month = this.currentMonth.getMonth();

                const monthName = new Date(year, month).toLocaleDateString('es', { month: 'long', year: 'numeric' });
                title.textContent = monthName.charAt(0).toUpperCase() + monthName.slice(1);

                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                // Render days...
                // Assume implementation for calendar grid
            },

            renderReports() {
                const container = /* assume */;
                const monthShows = Object.values(this.shows).filter(s => /* in month */);
                let totalIncome = 0;
                let lisaurioIncome = 0;
                let sellerIncomes = {};

                monthShows.forEach(show => {
                    totalIncome += show.total;

                    if (show.seller === 'lisaurio') {
                        lisaurioIncome += (show.saldoLisaurio || 0);
                        
                        if (show.musicianPayments) {
                            show.musicianPayments.forEach(mp => {
                                const musicianName = this.config.musicians[mp.musician]?.name || mp.musician;
                                sellerIncomes[musicianName] = (sellerIncomes[musicianName] || 0) + mp.amount;
                            });
                        }
                    } else {
                        lisaurioIncome += (show.saldoLisaurio || 0);
                        const sellerName = this.getSellerName(show.seller);
                        sellerIncomes[sellerName] = (sellerIncomes[sellerName] || 0) + (show.saldoSeller || 0);
                    }
                });

                let statsHTML = `
                    <div class="stat-card">
                        <div class="stat-value">$${this.formatMoney(totalIncome)}</div>
                        <div class="stat-label">Ingreso Total</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">$${this.formatMoney(lisaurioIncome)}</div>
                        <div class="stat-label">Lisaurio</div>
                    </div>
                `;

                Object.keys(sellerIncomes).forEach(name => {
                    statsHTML += `
                        <div class="stat-card">
                            <div class="stat-value">$${this.formatMoney(sellerIncomes[name])}</div>
                            <div class="stat-label">${name}</div>
                        </div>
                    `;
                });

                container.innerHTML = statsHTML;
            },

            getFilteredShows() {
                if (this.currentUser !== 'lisaurio' && this.currentView === 'list') {
                    return Object.values(this.shows).filter(s => 
                        s.seller === this.currentUser || 
                        s.depositTo === this.currentUser ||
                        (s.musicianPayments && s.musicianPayments.some(mp => mp.musician === this.currentUser))
                    );
                }
                return Object.values(this.shows);
            },

            shouldShowDetails(show) {
                if (this.currentUser === 'lisaurio') {
                    return {
                        showTotal: true,
                        showExpenses: true,
                        canSeeDeposit: true,
                        showAddress: true,
                        showPhone: true,
                        showSeller: true,
                        canSeeSaldos: true,
                        showFullDetails: true
                    };
                }

                if (show.seller === this.currentUser) {
                    return {
                        showTotal: true,
                        showExpenses: true,
                        canSeeDeposit: true,
                        showAddress: true,
                        showPhone: true,
                        showSeller: true,
                        canSeeSaldos: true,
                        showFullDetails: true
                    };
                }

                return {
                    showTotal: false,
                    showExpenses: false,
                    canSeeDeposit: false,
                    showAddress: false,
                    showPhone: false,
                    showSeller: false,
                    canSeeSaldos: false,
                    showFullDetails: false
                };
            },

            // Utility methods
            formatMoney(amount) {
                return amount.toLocaleString('es-AR', { minimumFractionDigits: 0 });
            },

            getSellerName(id) {
                return this.config.sellers[id]?.name || id;
            },

            saveConfig() {
                this.db.ref('config').set(this.config);
            },

            // Assume other methods: updateConfigToggles, updateCSSColors, updateSellerOptions, calculateSaldo, closeModal, addToLog, updateShowCounter, render day shows in calendar, etc.
            addToLog(action, data) {
                // Implement if needed, perhaps sync to db.ref('logs').push({action, data})
            },

            // ...
        };

        app.init();
    </script>
